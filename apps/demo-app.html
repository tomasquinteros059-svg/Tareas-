/*
  Tres colores, con jerarquía:
    neutro   ~70%  el papel y los grises (con una pizca de verde, para que no sean grises de fábrica)
    grafito  ~20%  la barra, los textos, las líneas: el peso de la app
    verde     ~8%  sólo acciones. Un verde por pantalla.
    ocre      ~2%  sólo alarma: deuda, bloqueo, cancelar.
*/
:root {
  color-scheme: light;

  --papel: #FFFFFF;
  --fondo: #F3F6F1;
  --hueco: #EAEEE6;
  --linea: #E2E7DE;
  --linea-fuerte: #C7CFC3;

  --grafito: #12181A;
  --grafito-2: #2A3235;
  --tinta-2: #4B5551;
  --tenue: #78827C;

  --verde: #2F9E3E;
  --verde-hover: #268433;
  --verde-tinta: #1E6B27;
  --verde-suave: #E9F5E7;

  --ocre: #B4622C;
  --ocre-tinta: #8E4A1E;
  --ocre-suave: #FAEFE6;

  --r-chico: 8px;
  --r: 12px;
  --r-grande: 16px;
  --sombra: 0 1px 2px rgba(18,24,26,.04), 0 8px 20px -14px rgba(18,24,26,.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--hueco); color: var(--grafito);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: Chivo, system-ui, sans-serif; margin: 0; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

#app { max-width: 460px; margin: 0 auto; min-height: 100%; background: var(--papel); display: flex; flex-direction: column; }

/* ---------- Barra: el bloque oscuro que sostiene todo ---------- */
.barra {

}

}

.nivel-tag { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }

.btn:focus-visible, .usuario-chip:focus-visible, nav.pestanas button:focus-visible, .seg button:focus-visible,

/* ---------- Formularios ---------- */

}
textarea { min-height: 82px; resize: vertical; font-family: inherit; }
input[type="range"] { padding: 0; border: none; accent-color: var(--verde); }

.opcion { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; padding: 13px; border: 1px solid var(--linea); border-radius: var(--r-chico); margin-bottom: 8px; cursor: pointer; }

/* ---------- Piezas del producto ---------- */
.monto-gigante { font-family: Chivo, sans-serif; font-size: 36px; font-weight: 900; letter-spacing: -.035em; line-height: 1; }
.folio { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .1em; color: var(--tinta-2); border: 1px solid var(--linea-fuerte); border-radius: 4px; padding: 3px 8px; display: inline-block; }

.portada { display: flex; flex-direction: column; flex: 1; min-height: 100%; background: var(--papel); }

.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 22px 24px 0; }

.muestra { margin: 22px 24px 0; border: 1px solid var(--linea); border-radius: var(--r); padding: 15px; }

.portada-acciones { padding: 24px 24px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.o-bien { display: flex; align-items: center; gap: 12px; color: var(--tenue); font-size: 12px; margin: 6px 0; }
.o-bien::before, .o-bien::after { content: ""; height: 1px; background: var(--linea); flex: 1; }
.legal { font-size: 11.5px; color: var(--tenue); text-align: center; }

.post-cab .quien b { font-size: 14.5px; font-family: Chivo, sans-serif; }

/* ---------- Propina ---------- */
.propinas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.propinas button { border: 1px solid var(--linea-fuerte); background: var(--papel); border-radius: var(--r-chico); padding: 10px 2px; font-size: 13px; cursor: pointer; }
.propinas button[aria-pressed="true"] { border-color: var(--verde); background: var(--verde-suave); color: var(--verde-tinta); font-weight: 600; }

/* ---------- Primer paso del trabajador ---------- */
.pasos-alta { counter-reset: paso; }
.paso-alta { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linea); }
.paso-alta:first-child { border-top: none; }
.paso-alta .n { width: 22px; height: 22px; border-radius: 50%; background: var(--grafito); color: #fff; display: grid; place-items: center; font: 700 11px/1 Chivo, sans-serif; flex: none; }
.paso-alta .n.listo { background: var(--verde); }
.paso-alta .txt { flex: 1; }
.paso-alta .txt b { font-size: 14px; font-family: Chivo, sans-serif; }
.paso-alta .txt small { display: block; color: var(--tinta-2); font-size: 12.5px; }

#avisos { position: fixed; left: 0; right: 0; bottom: 82px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 40; }
.aviso { max-width: 400px; margin: 0 14px; background: var(--grafito); color: #fff; padding: 12px 16px; border-radius: var(--r-chico); font-size: 13.5px; box-shadow: 0 12px 30px -14px rgba(0,0,0,.7); animation: entrar .18s ease-out; }
.aviso.mal { background: var(--ocre-tinta); }
.aviso.bien { background: var(--verde-tinta); }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

function techo(n) { return Math.ceil(n / PASO) * PASO; }
function unidadTexto(u, n) {
  if (u === "HORA") return n === 1 ? "hora" : "horas";
  if (u === "DIA") return n === 1 ? "día" : "días";
  if (u === "M2") return "m²";
  return n === 1 ? "trabajo" : "trabajos";
}
/*
  Acá el dinero está en pesos chilenos, que no tienen centavos: la unidad
  mínima es el peso entero. Por eso no se divide por cien en ningún lado.
*/
function plata(c) {
  return "$" + Math.round(c).toLocaleString("es-CL");
}
function km(a, b) {
  var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return Number((2 * R * Math.asin(Math.sqrt(h))).toFixed(2));
}
function rango(n) { return NIVELES.indexOf(n); }
function alcanza(n, min) { return rango(n) >= rango(min); }

/** Presupuesto mínimo de una tarea, con el detalle de cómo se armó. */
function cotizar(c) {
  var r = rubroPorSlug[c.rubro];
  var unidades = Math.max(Number(c.unidades) || 0, r.min);
  var lineas = [];
  var monto = r.piso * unidades;
  lineas.push(["Tarifa base · " + unidades + " " + unidadTexto(r.unidad, unidades), monto]);
  monto = Math.round(monto * F_DIF[c.dificultad]);
  lineas.push(["Dificultad ×" + F_DIF[c.dificultad], monto]);
  if (F_URG[c.urgencia] !== 1) {
    monto = Math.round(monto * F_URG[c.urgencia]);
    lineas.push(["Urgencia ×" + F_URG[c.urgencia], monto]);
  }
  if (F_NIV[c.nivelMinimo] !== 1) {
    monto = Math.round(monto * F_NIV[c.nivelMinimo]);
    lineas.push(["Nivel exigido ×" + F_NIV[c.nivelMinimo], monto]);
  }
  if (c.fueraDeHorario) {
    monto = Math.round(monto * F_HORARIO);
    lineas.push(["Fuera de horario ×" + F_HORARIO, monto]);
  }
  var extra = Math.max(0, (c.distanciaKm || 0) - KM_GRATIS);
  if (extra > 0) {
    var traslado = Math.round(extra * COSTO_KM);
    monto += traslado;
    lineas.push(["Traslado · " + extra.toFixed(1) + " km", traslado]);
  }
  var materiales = Math.max(0, c.materiales || 0);
  var minimo = techo(monto) + materiales;
  if (materiales) lineas.push(["Materiales (sin comisión)", materiales]);
  return {
    unidades: unidades, minimo: minimo, sugerido: techo(Math.round(minimo * 1.2)),
    alto: techo(Math.round(minimo * 1.5)), lineas: lineas
  };
}

/** Reparto del dinero. Con tarjeta se acredita; en efectivo queda como deuda. */
function liquidar(t, nivelTrabajador) {
  var r = rubroPorSlug[t.rubro];
  var materiales = t.materiales || 0;
  var propina = Math.max(0, t.propina || 0);
  var manoDeObra = Math.max(0, t.presupuesto - materiales);
  var tasa = Math.max(.05, Number((r.com - DESC_NIVEL[nivelTrabajador]).toFixed(4)));
  var comision = Math.max(Math.floor(manoDeObra * tasa), Math.min(COMISION_MINIMA, manoDeObra));
  var servicio = Math.floor(t.presupuesto * CARGO_SERVICIO);
  // La propina no paga comisión: va entera a quien hizo el trabajo.
  var neto = manoDeObra - comision + materiales + propina;
  if (t.metodoPago === "TARJETA") {
    var total = t.presupuesto + servicio + propina;
    var proc = Math.floor(total * PROC_TASA) + PROC_FIJO;
    return { tasa: tasa, comision: comision, servicio: servicio, propina: propina, neto: neto, cobroCliente: total,
      enMano: 0, deuda: 0, proc: proc, movimiento: neto, plataforma: comision + servicio - proc };
  }
  var deuda = comision + servicio;
  return { tasa: tasa, comision: comision, servicio: servicio, propina: propina, neto: t.presupuesto + propina - deuda,
    cobroCliente: 0, enMano: t.presupuesto + propina, deuda: deuda, proc: 0, movimiento: -deuda, plataforma: deuda };
}

var CARGO_CANCELACION = .20;

/**
 * Cancelar tiene costo sólo cuando el trabajador ya salió para el domicilio.
 * La mayor parte de esa retención es para él: perdió el viaje y el horario.
 */
function cargoPorCancelacion(t, estado) {
  if (estado !== "EN_CAMINO") return { cargo: 0, compensacion: 0 };
  var cargo = Math.floor(t.presupuesto * CARGO_CANCELACION);
  return { cargo: cargo, compensacion: Math.floor(cargo * .8) };
}

function calificacionBayesiana(cantidad, suma) {
  return Number(((suma + 4.3 * 5) / (cantidad + 5)).toFixed(2));
}

function calcularNivel(u) {
  if (u.doc.estado !== "VERIFICADO") return "NUEVO";
  var s = u.stats;
  var estrellas = calificacionBayesiana(s.cantidad, s.suma);
  var cancel = s.aceptados ? s.cancelados / s.aceptados : 0;
  var punt = s.cantidad ? s.puntuales / s.cantidad : 1;
  for (var i = 0; i < REQUISITOS.length; i++) {
    var q = REQUISITOS[i];
    if (s.completados >= q.trabajos && estrellas >= q.estrellas && cancel <= q.cancel && punt >= q.punt) return q.nivel;
  }
  return "NUEVO";
}

function faltaParaSubir(u) {
  var actual = calcularNivel(u);
  var i = REQUISITOS.findIndex(function (q) { return q.nivel === actual; });
  var objetivo = i === -1 ? REQUISITOS[REQUISITOS.length - 1] : REQUISITOS[i - 1];
  if (!objetivo) return null;
  var s = u.stats, faltan = [];
  var estrellas = calificacionBayesiana(s.cantidad, s.suma);
  if (s.completados < objetivo.trabajos) faltan.push((objetivo.trabajos - s.completados) + " trabajos más");
  if (estrellas < objetivo.estrellas) faltan.push("llegar a " + objetivo.estrellas + " estrellas");
  return { nivel: objetivo.nivel, faltan: faltan, progreso: Math.min(1, s.completados / objetivo.trabajos) };
}

function olaDe(segundos) {
  for (var i = 0; i < OLAS.length; i++) {
    var o = OLAS[i];
    if (segundos >= o.desde && (o.hasta === null || segundos < o.hasta)) return o;
  }
  return OLAS[OLAS.length - 1];
}

/** Única puerta: ¿este trabajador puede tomar esta tarea, y si no, por qué? */
function elegibilidad(t, u) {
  var r = rubroPorSlug[t.rubro];
  var seg = Math.max(0, (ahora() - t.publicadaEn) / 1000);
  var ola = olaDe(seg);
  var dist = km(zonaPorId[t.zona], zonaPorId[u.zona]);
  var base = { ola: ola, dist: dist, seg: seg };
  function no(motivo, detalle) { return Object.assign({ ok: false, motivo: motivo, detalle: detalle }, base); }

  if (t.autorId === u.id) return no("Es tu propia tarea");
  if (!u.esTrabajador) return no("Todavía no activaste tu perfil de trabajador", "Activalo en Perfil");
  if (u.doc.estado !== "VERIFICADO") return no("Verificá tu documento para poder tomar trabajos", "Perfil › documento");
  if (!u.telefonoOk) return no("Verificá tu teléfono");
  if (u.rubros.indexOf(t.rubro) === -1) return no("No tenés " + r.nombre + " en tu perfil", "Agregalo en Perfil");
  if (r.titulo && !u.formacion) return no("Este trabajo pide carrera universitaria acreditada", "Cargá tu formación en Perfil");
  if (r.licencia && u.licencias.indexOf(t.rubro) === -1) return no(r.nombre + " exige matrícula validada");
  if ((r.antecedentes || t.exigeAntecedentes) && !u.antecedentes) return no("Esta tarea exige antecedentes verificados");
  if (!alcanza(u.nivel, t.nivelMinimo)) return no("Pide nivel " + t.nivelMinimo + " o superior");
  if (t.metodoPago === "EFECTIVO" && !u.aceptaEfectivo) return no("No aceptás pagos en efectivo");
  if (u.saldo <= -LIMITE_DEUDA) return no("Saldá tus comisiones pendientes", "Debés " + plata(-u.saldo));
  if (dist > ola.radio) return no("Todavía fuera del radio de esta ola", "Está a " + dist + " km, la ola llega a " + ola.radio + " km");
  if (!alcanza(u.nivel, ola.nivel)) {
    var faltan = 0;
    for (var i = 0; i < OLAS.length; i++) if (alcanza(u.nivel, OLAS[i].nivel)) { faltan = Math.max(0, OLAS[i].desde - seg); break; }
    return no("Se abre para tu nivel en " + Math.ceil(faltan) + " s", "Los " + ola.nivel + " la ven primero");
  }
  return Object.assign({ ok: true }, base);
}

function puedeTransicionar(desde, hacia, rol) {
  return TRANSICIONES.some(function (x) { return x[0] === desde && x[1] === hacia && x[2] === rol; });

var CLAVE = "tareas.app.v3";

  if (enMemoria) return true;
  try { localStorage.setItem(CLAVE, JSON.stringify(db)); return true; }
  catch (e) {
    // Si es falta de espacio (típico con fotos) seguimos en memoria y avisamos.
    if (e && (e.name === "QuotaExceededError" || e.code === 22)) return false;
    enMemoria = true;
    return false;
  }
}
function leerDisco() {
  try {
    var crudo = localStorage.getItem(CLAVE);

    unidades: 1, dificultad: "ALTA", urgencia: "PROGRAMADA", nivelMinimo: "PLATA",

  }, true);
  crearTarea(carla, {

function arrancar() {
  var disco = leerDisco();
  if (disco && disco.usuarios && disco.usuarios.length) {
    db = disco;
    if (!db.avisos) db.avisos = [];
  }
  else semilla();

/* ==========================================================================
   3. OPERACIONES
   ========================================================================== */

function usuario(uid) {
  for (var i = 0; i < db.usuarios.length; i++) if (db.usuarios[i].id === uid) return db.usuarios[i];
  return null;
}
function yo() { return usuario(db.sesionId); }
function tarea(tid) {
  for (var i = 0; i < db.tareas.length; i++) if (db.tareas[i].id === tid) return db.tareas[i];
  return null;
}
function evento(t, hacia, quien, nota) {
  db.eventos.push({ id: id("e"), tareaId: t.id, hacia: hacia, quien: quien, nota: nota || "", cuando: ahora() });
}

function avisar(usuarioId, tipo, texto, tareaId) {
  if (!usuarioId || usuarioId === db.sesionId) return;   // a uno mismo no se le avisa
  db.avisos.unshift({ id: id("n"), usuarioId: usuarioId, tipo: tipo, texto: texto, tareaId: tareaId || null, leido: false, cuando: ahora() });
  if (db.avisos.length > 200) db.avisos.length = 200;
}
function avisosDe(uid) { return db.avisos.filter(function (n) { return n.usuarioId === uid; }); }
function sinLeer(uid) { return avisosDe(uid).filter(function (n) { return !n.leido; }).length; }

/** Al publicar, le avisamos a los trabajadores que podrían tomarla. */
function avisarNuevaTarea(t) {
  db.usuarios.forEach(function (u) {
    if (!u.esTrabajador || u.id === t.autorId) return;
    if (u.rubros.indexOf(t.rubro) === -1) return;
    avisar(u.id, "TRABAJO", "Nuevo trabajo cerca tuyo: " + t.titulo + " · " + plata(t.presupuesto), t.id);
  });
}

function crearTarea(autor, datos, sinAvisar) {
  var q = cotizar(datos);
  var t = {
    id: id("t"), folio: folioNuevo(), autorId: autor.id, trabajadorId: null,
    rubro: datos.rubro, titulo: datos.titulo, descripcion: datos.descripcion,
    unidades: Math.max(Number(datos.unidades), rubroPorSlug[datos.rubro].min),
    dificultad: datos.dificultad, urgencia: datos.urgencia, nivelMinimo: datos.nivelMinimo,
    exigeAntecedentes: !!datos.exigeAntecedentes, materiales: datos.materiales || 0,
    programadaPara: datos.programadaPara || "", franja: datos.franja || "",
    fotos: datos.fotos || [], fotosEntrega: [], propina: 0, disputa: null,
    minimo: q.minimo, presupuesto: datos.presupuesto, metodoPago: datos.metodoPago, zona: datos.zona,
    estado: "PUBLICADA", codigoInicio: String(Math.floor(1000 + Math.random() * 9000)),
    publicadaEn: ahora(), asignadaEn: null, entregadaEn: null, cerradaEn: null,
    pago: { estado: datos.metodoPago === "TARJETA" ? "RETENIDO" : "PENDIENTE", total: datos.presupuesto + Math.floor(datos.presupuesto * CARGO_SERVICIO) }
  };
  db.tareas.unshift(t);
  evento(t, "PUBLICADA", autor.id, "Publicada con precio cerrado");
  if (!sinAvisar) { avisarNuevaTarea(t); marcar(); guardar(); }
  return t;
}

function aceptarTarea(tid) {
  recargar();
  var t = tarea(tid), u = yo();
  if (!t) return aviso("Esa tarea ya no existe", "mal");
  if (t.estado !== "PUBLICADA" || t.trabajadorId) return aviso("Otro trabajador la tomó primero", "mal");
  var e = elegibilidad(t, u);
  if (!e.ok) return aviso(e.motivo, "mal");
  t.estado = "ASIGNADA";
  t.trabajadorId = u.id;
  t.asignadaEn = ahora();
  u.stats.aceptados++;
  evento(t, "ASIGNADA", u.id, "La tomó en la ola " + (OLAS.indexOf(e.ola) + 1) + ", a " + e.dist + " km");
  avisar(t.autorId, "TOMADA", u.nombre + " tomó tu tarea: " + t.titulo, t.id);
  marcar(); guardar();
  aviso("Es tuya. Ya podés ver la dirección exacta.", "bien");
  ir("tarea", { id: t.id });
}

function cambiarEstado(tid, hacia, extra) {
  recargar();
  var t = tarea(tid), u = yo();
  var rol = t.autorId === u.id ? "CLIENTE" : (t.trabajadorId === u.id ? "TRABAJADOR" : null);
  if (!rol) return aviso("No participás de esta tarea", "mal");
  if (!puedeTransicionar(t.estado, hacia, rol)) return aviso("Ese paso no corresponde ahora", "mal");

  var estadoPrevio = t.estado;
  if (hacia === "EN_PROGRESO") {
    if (String(extra && extra.codigo).trim() !== t.codigoInicio) return aviso("El código no coincide", "mal");
    t.iniciadaEn = ahora();
    t.puntual = true;
  }
  if (hacia === "PUBLICADA") {
    var anterior = usuario(t.trabajadorId);
    if (anterior) anterior.stats.cancelados++;
    t.trabajadorId = null; t.asignadaEn = null; t.publicadaEn = ahora();
    evento(t, "PUBLICADA", u.id, "El trabajador se bajó: vuelve a la fila");
    t.estado = "PUBLICADA";
    marcar(); guardar(); render();
    return aviso("La tarea volvió al radar", "bien");
  }
  if (hacia === "ENTREGADA") {
    t.entregadaEn = ahora();
    avisar(t.autorId, "ENTREGADA", "Terminaron tu tarea: " + t.titulo + ". Revisá y confirmá.", t.id);
  }
  if (hacia === "EN_CAMINO") avisar(t.autorId, "EN_CAMINO", u.nombre + " va en camino. Tené a mano el código " + t.codigoInicio + ".", t.id);
  if (hacia === "CANCELADA") {
    t.cerradaEn = ahora();
    t.pago.estado = t.metodoPago === "TARJETA" ? "LIBERADO" : "CANCELADO";
    var multa = cargoPorCancelacion(t, estadoPrevio);
    if (multa.cargo > 0 && t.trabajadorId) {
      var quien = usuario(t.trabajadorId);
      quien.saldo += multa.compensacion;
      db.movimientos.unshift({
        id: id("m"), usuarioId: quien.id, tareaId: t.id, tipo: "COMPENSACION",
        monto: multa.compensacion, saldo: quien.saldo, cuando: ahora(),
        detalle: "Te compensamos porque cancelaron cuando ya ibas en camino"
      });
      t.cargoCancelacion = multa.cargo;
      avisar(quien.id, "CANCELADA", "Cancelaron " + t.titulo + ". Te compensamos " + plata(multa.compensacion) + ".", t.id);
    } else if (t.trabajadorId) {
      avisar(t.trabajadorId, "CANCELADA", "Cancelaron la tarea " + t.titulo + ".", t.id);
    }
  }

  t.estado = hacia;
  evento(t, hacia, u.id, extra && extra.nota);

  if (hacia === "CONFIRMADA") {
    t.propina = Math.max(0, (extra && extra.propina) || 0);
    liquidarTarea(t);
    return;
  }
  marcar(); guardar(); render();
  var frases = {
    EN_CAMINO: "Avisamos que vas en camino", EN_PROGRESO: "Empezó el trabajo",
    ENTREGADA: "Avisamos que terminaste", CANCELADA: "Tarea cancelada"
  };
  if (frases[hacia]) aviso(frases[hacia], "bien");
}

function liquidarTarea(t) {
  var trabajador = usuario(t.trabajadorId);
  var l = liquidar(t, trabajador.nivel);
  trabajador.saldo += l.movimiento;
  trabajador.stats.completados++;
  db.movimientos.unshift({
    id: id("m"), usuarioId: trabajador.id, tareaId: t.id,
    tipo: t.metodoPago === "TARJETA" ? "ACREDITACION" : "DEUDA_COMISION",
    monto: l.movimiento, saldo: trabajador.saldo, cuando: ahora(),
    detalle: t.metodoPago === "TARJETA" ? "Tarea " + t.folio + " acreditada" : "Comisión de " + t.folio + " (cobraste en efectivo)"
  });
  t.pago = {
    estado: t.metodoPago === "TARJETA" ? "COBRADO" : "EN_MANO", total: l.cobroCliente,
    comision: l.comision, tasa: l.tasa, servicio: l.servicio, neto: l.neto, proc: l.proc
  };
  t.estado = "PAGADA";
  t.cerradaEn = ahora();
  evento(t, "PAGADA", null, "Liquidada: " + plata(l.comision) + " de comisión");
  trabajador.nivel = calcularNivel(trabajador);
  avisar(trabajador.id, "PAGADA", t.metodoPago === "TARJETA"
    ? "Te acreditamos " + plata(l.neto) + " por " + t.titulo
    : "Confirmaron " + t.titulo + ". Cobraste en mano.", t.id);
  marcar(); guardar(); render();
  aviso(t.metodoPago === "TARJETA" ? "Pago confirmado. Se acreditó " + plata(l.neto) : "Confirmado. El trabajador cobró en mano.", "bien");
}

/** Si algo salió mal, la tarea se congela hasta que soporte decida. */
function abrirDisputa(tid, motivo) {
  recargar();
  var t = tarea(tid), u = yo();
  if (["EN_PROGRESO", "ENTREGADA"].indexOf(t.estado) === -1) {
    return aviso("Se puede reclamar mientras el trabajo está en curso o recién entregado", "mal");
  }
  t.disputa = { motivo: motivo, abiertaPor: u.id, cuando: ahora(), resuelta: null };
  t.estado = "EN_DISPUTA";
  evento(t, "EN_DISPUTA", u.id, motivo);
  avisar(t.autorId === u.id ? t.trabajadorId : t.autorId, "DISPUTA", "Se abrió un reclamo en " + t.titulo, t.id);
  marcar(); guardar(); render();
  aviso("Reclamo abierto. Soporte lo va a revisar.", "bien");
}

/** Resolución de soporte: o se paga el trabajo, o se cancela y se libera. */
function resolverDisputa(tid, aFavorDelTrabajador) {
  recargar();
  var t = tarea(tid);
  if (!t.disputa) return;
  t.disputa.resuelta = aFavorDelTrabajador ? "TRABAJADOR" : "CLIENTE";
  if (aFavorDelTrabajador) {
    t.estado = "CONFIRMADA";
    evento(t, "CONFIRMADA", null, "Soporte falló a favor del trabajador");
    liquidarTarea(t);
  } else {
    t.estado = "CANCELADA";
    t.cerradaEn = ahora();
    t.pago.estado = t.metodoPago === "TARJETA" ? "LIBERADO" : "CANCELADO";
    evento(t, "CANCELADA", null, "Soporte falló a favor del cliente: se libera el pago");
    avisar(t.trabajadorId, "DISPUTA", "Soporte resolvió el reclamo de " + t.titulo + " a favor del cliente.", t.id);
    marcar(); guardar(); render();
  }
  aviso("Reclamo resuelto", "bien");
}

function calificar(tid, estrellas, comentario, puntual) {
  recargar();
  var t = tarea(tid), u = yo();
  var destino = t.autorId === u.id ? t.trabajadorId : t.autorId;
  if (db.calificaciones.some(function (c) { return c.tareaId === tid && c.autorId === u.id; })) return aviso("Ya calificaste esta tarea", "mal");
  db.calificaciones.push({
    id: id("c"), tareaId: tid, autorId: u.id, destinoId: destino,
    estrellas: estrellas, comentario: comentario || "", puntual: !!puntual, visible: false, cuando: ahora()
  });
  var otra = db.calificaciones.filter(function (c) { return c.tareaId === tid; });
  if (otra.length >= 2) otra.forEach(function (c) { c.visible = true; });

  avisar(destino, "CALIFICACION", "Te calificaron en " + t.titulo, t.id);
  var d2 = usuario(destino);
  if (d2.esTrabajador && destino === t.trabajadorId) {
    d2.stats.suma += estrellas;
    d2.stats.cantidad++;
    if (puntual) d2.stats.puntuales++;
    d2.nivel = calcularNivel(d2);
  }
  marcar(); guardar(); render();
  aviso(otra.length >= 2 ? "Listo. Ya se ven las dos calificaciones." : "Gracias. Se muestra cuando la otra parte también califique.", "bien");
}

function preguntar(tid, texto) {
  recargar();
  var t = tarea(tid), u = yo();
  var mias = db.preguntas.filter(function (p) { return p.tareaId === tid && p.autorId === u.id; });
  if (mias.length >= 2) return aviso("Podés hacer hasta 2 preguntas por tarea. Si te sirve, tomala.", "mal");
  db.preguntas.push({ id: id("p"), tareaId: tid, autorId: u.id, texto: texto, respuesta: "", cuando: ahora() });
  marcar(); guardar(); render();
  aviso("Pregunta enviada", "bien");
}

function responder(pid, texto) {
  recargar();
  for (var i = 0; i < db.preguntas.length; i++) if (db.preguntas[i].id === pid) db.preguntas[i].respuesta = texto;
  marcar(); guardar(); render();
}

function mensajear(tid, texto) {
  recargar();
  var t = tarea(tid);
  db.mensajes.push({ id: id("s"), tareaId: tid, autorId: db.sesionId, texto: texto, cuando: ahora() });
  avisar(t.autorId === db.sesionId ? t.trabajadorId : t.autorId, "MENSAJE", yo().nombre.split(" ")[0] + ": " + texto, tid);
  marcar(); guardar(); render();
}

function pagarDeuda() {
  var u = yo();
  if (u.saldo >= 0) return aviso("No tenés deuda", "mal");
  var monto = -u.saldo;
  u.saldo = 0;
  db.movimientos.unshift({ id: id("m"), usuarioId: u.id, tipo: "PAGO_DEUDA", monto: monto, saldo: 0, cuando: ahora(), detalle: "Pagaste las comisiones pendientes" });
  marcar(); guardar(); render();
  aviso("Deuda saldada. Ya podés tomar trabajos.", "bien");
}

function retirar() {
  var u = yo();
  if (u.saldo <= 0) return aviso("No tenés saldo para retirar", "mal");
  var monto = u.saldo;
  u.saldo = 0;
  db.movimientos.unshift({ id: id("m"), usuarioId: u.id, tipo: "RETIRO", monto: -monto, saldo: 0, cuando: ahora(), detalle: "Retiro a tu cuenta bancaria" });
  marcar(); guardar(); render();
  aviso("Retiraste " + plata(monto), "bien");
}

var vista = { pantalla: "portada", params: {}, borrador: null, cat: "PARA_VOS", estrellas: 0,
  busqueda: "", distancia: 0, montoMin: 0, propina: 0 };

function ir(pantalla, params) {
  vista.pantalla = pantalla;
  vista.params = params || {};
  window.scrollTo(0, 0);
  render();
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function iniciales(n) { return n.split(" ").slice(0, 2).map(function (p) { return p[0]; }).join("").toUpperCase(); }
function estrellasDe(u) { return calificacionBayesiana(u.stats.cantidad, u.stats.suma).toFixed(2); }
function hace(ms) {
  var s = Math.max(0, Math.round((ahora() - ms) / 1000));
  if (s < 60) return "hace " + s + " s";
  if (s < 3600) return "hace " + Math.round(s / 60) + " min";
  if (s < 86400) return "hace " + Math.round(s / 3600) + " h";
  return "hace " + Math.round(s / 86400) + " días";
}
function reloj(ms) {
  var f = new Date(ms);
  return String(f.getHours()).padStart(2, "0") + ":" + String(f.getMinutes()).padStart(2, "0");
}
/** El nivel se lee por peldaños: cuatro escalones que se van llenando. */
function chipNivel(n) {
  var lleno = NIVELES.indexOf(n);
  var barras = "";
  for (var i = 1; i <= 4; i++) barras += '<i class="' + (i <= lleno ? "on" : "") + '"></i>';
  return '<span class="nivel-tag"><span class="peldanos">' + barras + "</span>" + n + "</span>";
}
var FRANJAS = { MANANA: "Mañana · 8 a 12", TARDE: "Tarde · 12 a 18", NOCHE: "Noche · 18 a 22" };

function fechaLinda(iso) {
  if (!iso) return "";
  var d = new Date(iso + "T12:00:00");
  var dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  return dias[d.getDay()] + " " + d.getDate() + " " + meses[d.getMonth()];
}
function cuandoTexto(t) {
  if (t.urgencia === "INMEDIATA") return "Ahora mismo";
  if (!t.programadaPara) return t.urgencia === "HOY" ? "Hoy" : "A coordinar";
  return fechaLinda(t.programadaPara) + (t.franja ? " · " + FRANJAS[t.franja].split(" · ")[0].toLowerCase() : "");
}

function nombrePago(m) { return m === "TARJETA" ? "Webpay" : "Efectivo"; }

function nombreCat(c) {
  for (var i = 0; i < CATEGORIAS.length; i++) if (CATEGORIAS[i].id === c) return CATEGORIAS[i].nombre;
  return c;
}

function aviso(texto, tono) {
  var d = document.createElement("div");
  d.className = "aviso " + (tono || "");
  d.textContent = texto;
  document.getElementById("avisos").appendChild(d);

}

/* ---------- Feed ---------- */
function puntajeRecomendacion(t, u, e) {
  var p = 0;
  if (e.ok) p += 1000;
  if (u.rubros.indexOf(t.rubro) >= 0) p += 400;
  if (rubroPorSlug[t.rubro].cat === "ESPECIAL" && u.formacion) p += 120;
  p += Math.max(0, 200 - e.dist * 8);
  p += Math.min(150, t.presupuesto / 200);
  return p;
}

function vistaFeed() {
  var u = yo();
  var abiertas = db.tareas.filter(function (t) { return t.estado === "PUBLICADA" && t.autorId !== u.id; });
  var cat = vista.cat;
  var lista = abiertas.map(function (t) { return { t: t, e: elegibilidad(t, u) }; });

  if (cat === "PARA_VOS") {
    lista.sort(function (a, b) { return puntajeRecomendacion(b.t, u, b.e) - puntajeRecomendacion(a.t, u, a.e); });
  } else {
    lista = lista.filter(function (x) { return rubroPorSlug[x.t.rubro].cat === cat; });
    lista.sort(function (a, b) {
      if (a.e.ok !== b.e.ok) return a.e.ok ? -1 : 1;
      return b.t.publicadaEn - a.t.publicadaEn;
    });
  }

  // Buscar por palabra y filtrar por distancia y monto
  var q = vista.busqueda.trim().toLowerCase();
  if (q) {
    lista = lista.filter(function (x) {
      return (x.t.titulo + " " + x.t.descripcion + " " + rubroPorSlug[x.t.rubro].nombre).toLowerCase().indexOf(q) >= 0;
    });
  }
  if (vista.distancia) lista = lista.filter(function (x) { return x.e.dist <= vista.distancia; });
  if (vista.montoMin) lista = lista.filter(function (x) { return x.t.presupuesto >= vista.montoMin; });

  var guia = "";
  for (var i = 0; i < CATEGORIAS.length; i++) if (CATEGORIAS[i].id === cat) guia = CATEGORIAS[i].guia;

  var h = '<div class="buscador"><input id="f-buscar" placeholder="Buscar un trabajo" value="' + esc(vista.busqueda) + '">' +
    (vista.busqueda ? '<button class="btn chico" style="width:auto" data-accion="limpiar-busqueda">Limpiar</button>' : "") + "</div>";
  h += '<div class="filtros">' +
    '<select id="f-distancia"><option value="0">Cualquier distancia</option>' +
    [5, 10, 20, 40].map(function (k) { return '<option value="' + k + '"' + (vista.distancia === k ? " selected" : "") + ">Hasta " + k + " km</option>"; }).join("") + "</select>" +
    '<select id="f-monto"><option value="0">Cualquier monto</option>' +
    [10000, 30000, 60000, 150000].map(function (m) { return '<option value="' + m + '"' + (vista.montoMin === m ? " selected" : "") + ">Desde " + plata(m) + "</option>"; }).join("") + "</select>" +
    "</div>";

  h += '<div class="seg">' + CATEGORIAS.map(function (c) {
    return '<button data-accion="cat" data-cat="' + c.id + '" aria-pressed="' + (c.id === cat) + '">' + c.nombre + "</button>";
  }).join("") + "</div>";

  h += '<div style="padding:12px 16px 4px"><p class="guia">' + guia + "</p></div>";

  h += bienvenida(u);

  if (!lista.length) {
    h += '<div class="vacio">' + (q || vista.distancia || vista.montoMin
      ? "Nada coincide con lo que buscás.<br>Probá con menos filtros."
      : "No hay trabajos en " + nombreCat(cat) + " por ahora.<br>Probá otra solapa o publicá uno vos.") + "</div>";
    return h;
  }

  h += '<div class="feed">' + lista.map(function (x) { return postDe(x.t, x.e, u); }).join("") + "</div>";
  return h;
}

/**
 * A alguien recién llegado no le sirve un muro lleno de "no podés": le sirve
 * saber qué le falta. Estos son los dos pasos que lo habilitan.
 */
function bienvenida(u) {
  if (!u.esTrabajador) {
    return '<div style="padding:8px 16px"><div class="tarjeta"><h3>Estás como cliente</h3>' +
      '<p class="guia" style="margin-top:6px">Podés mirar todo y publicar tareas. Para tomar trabajos hay que activar el perfil de trabajador.</p>' +
      '<button class="btn primario" style="margin-top:14px" data-accion="ir" data-pantalla="editar">Activar mi perfil</button></div></div>';
  }
  var docOk = u.doc.estado === "VERIFICADO";
  var oficiosOk = u.rubros.length > 0;
  if (docOk && oficiosOk) return "";
  return '<div style="padding:8px 16px"><div class="tarjeta"><h3>Te faltan dos pasos para empezar</h3>' +
    '<div class="pasos-alta" style="margin-top:12px">' +
      '<div class="paso-alta"><span class="n' + (oficiosOk ? " listo" : "") + '">' + (oficiosOk ? "✓" : "1") + "</span>" +
      '<span class="txt"><b>Elegí qué sabés hacer</b><small>' +
      (oficiosOk ? u.rubros.length + " oficios cargados" : "Sin oficios no te aparece nada tomable") + "</small></span></div>" +
      '<div class="paso-alta"><span class="n' + (docOk ? " listo" : "") + '">' + (docOk ? "✓" : "2") + "</span>" +
      '<span class="txt"><b>Verificá tu documento</b><small>' +
      (docOk ? "Listo, ya estás verificado" : "Es lo que le da confianza a quien te abre la puerta") + "</small></span></div>" +
    "</div>" +
    '<button class="btn primario" style="margin-top:14px" data-accion="ir" data-pantalla="editar">Completar mi perfil</button></div></div>';
}

function postDe(t, e, u) {
  var r = rubroPorSlug[t.rubro];
  var autor = usuario(t.autorId);
  var l = liquidar(t, u.nivel);
  var guardado = u.guardados.indexOf(t.id) >= 0;

  var h = '<article class="post">';
  h += '<div class="post-cab"><span class="avatar" data-accion="ver-perfil" data-id="' + autor.id + '" style="cursor:pointer">' + iniciales(autor.nombre) + "</span>" +
    '<span class="quien" data-accion="ver-perfil" data-id="' + autor.id + '" style="cursor:pointer"><b>' + esc(autor.nombre) + "</b>" +
    "<small>" + esc(zonaPorId[t.zona].nombre) + " · " + hace(t.publicadaEn) + " · " +
    (e.dist < 0.5 ? "en tu zona" : "a " + e.dist + " km") + "</small></span>" +
    '<span class="chip">' + nombreCat(r.cat) + "</span></div>";

  h += '<div class="oficio rotulo">' + esc(r.nombre) + "</div>";
  h += "<h3>" + esc(t.titulo) + "</h3>";
  h += '<p class="cuerpo">' + esc(t.descripcion) + "</p>";
  if (t.fotos && t.fotos.length) {
    h += '<div class="fotos' + (t.fotos.length === 1 ? " una" : "") + '">' +
      t.fotos.map(function (f) { return '<img src="' + f + '" alt="Foto del trabajo">'; }).join("") + "</div>";
  }
  h += '<div class="chips">' +
    '<span class="chip' + (t.urgencia === "INMEDIATA" ? " alerta" : "") + '">' + esc(cuandoTexto(t)) + "</span>" +
    '<span class="chip">' + t.unidades + " " + unidadTexto(r.unidad, t.unidades) + "</span>" +
    '<span class="chip">' + t.dificultad + "</span>" +
    '<span class="chip">' + nombrePago(t.metodoPago) + "</span>" +
    (t.nivelMinimo !== "NUEVO" ? '<span class="chip' + (alcanza(u.nivel, t.nivelMinimo) ? "" : " alerta") + '">' + t.nivelMinimo + " o más</span>" : "") +
    (r.titulo ? '<span class="chip' + (u.formacion ? "" : " alerta") + '">Título</span>' : "") +
    (r.licencia ? '<span class="chip' + (u.licencias.indexOf(t.rubro) >= 0 ? "" : " alerta") + '">Matrícula</span>' : "") +
    "</div>";

  h += '<div class="post-precio"><span class="n">' + plata(t.presupuesto) + "</span>" +
    "<small>" + (e.ok ? "te quedan " + plata(l.neto) + " limpios" : "mínimo del oficio " + plata(t.minimo)) + "</small></div>";

  if (e.ok) {
    h += '<div class="post-pie">' +
      '<button class="btn primario" data-accion="aceptar" data-id="' + t.id + '">Aceptar</button>' +
      '<button class="btn chico icono" data-accion="guardar" data-id="' + t.id + '" title="Guardar">' + (guardado ? "★" : "☆") + "</button>" +
      '<button class="btn chico icono" data-accion="ir" data-pantalla="tarea" data-id="' + t.id + '" title="Ver">›</button></div>';
  } else {
    h += '<div class="bloqueo"><b>' + esc(e.motivo) + "</b>" + (e.detalle ? '<span class="guia">' + esc(e.detalle) + "</span>" : "") + "</div>" +
      '<div class="post-pie"><button class="btn chico" data-accion="ir" data-pantalla="tarea" data-id="' + t.id + '">Ver el detalle</button>' +
      '<button class="btn chico icono" data-accion="guardar" data-id="' + t.id + '">' + (guardado ? "★" : "☆") + "</button></div>";
  }
  return h + "</article>";
}

function hoyISO() {
  var d = new Date(ahora());
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/** Fotos: se comprimen en el navegador antes de guardarse. */
function bloqueFotos(fotos, destino) {
  var h = "";
  if (fotos.length) {
    h += '<div class="fotos' + (fotos.length === 1 ? " una" : "") + '">' + fotos.map(function (f, i) {
      return '<span class="foto-quitar"><img src="' + f + '" alt="Foto ' + (i + 1) + '">' +
        '<button type="button" data-accion="quitar-foto" data-destino="' + destino + '" data-i="' + i + '">×</button></span>';
    }).join("") + "</div>";
  }
  if (fotos.length < 3) {
    h += '<label class="subir" style="margin-top:' + (fotos.length ? "8px" : "0") + '">' +
      "Agregar foto" +
      '<input type="file" accept="image/*" data-fotos-para="' + destino + '"></label>';
  }
  return h;
}

function cajaPrecio(b) {
  var q = cotizar(b);
  var falta = b.presupuesto < q.minimo;
  var h = '<div class="rotulo">Tu presupuesto</div>';
  h += '<div class="monto-gigante" style="margin:4px 0 10px">' + plata(b.presupuesto) + "</div>";
  h += '<input type="range" id="f-precio" min="' + q.minimo + '" max="' + Math.max(q.alto * 2, q.minimo + 5000) + '" step="' + PASO + '" value="' + Math.max(b.presupuesto, q.minimo) + '">';
  h += '<div class="fila" style="margin-top:8px"><span class="k">No baja de</span><span class="v">' + plata(q.minimo) + "</span></div>";
  h += '<div class="fila"><span class="k">Sugerido para que la tomen rápido</span><span class="v">' + plata(q.sugerido) + "</span></div>";
  if (b.metodoPago === "TARJETA") {
    h += '<div class="fila"><span class="k">Se reserva en tu tarjeta</span><span class="v">' + plata(b.presupuesto + Math.floor(b.presupuesto * CARGO_SERVICIO)) + "</span></div>";
  }
  h += '<details style="margin-top:10px"><summary class="rotulo">Cómo se arma el mínimo</summary>' +
    q.lineas.map(function (l) { return '<div class="fila" style="margin-top:6px"><span class="k">' + esc(l[0]) + '</span><span class="v">' + plata(l[1]) + "</span></div>"; }).join("") + "</details>";
  if (falta) h += '<div class="error">Está por debajo del mínimo del oficio: no se puede publicar así.</div>';
  return h;
}

/* ---------- Mis tareas ---------- */
function vistaTareas() {
  var u = yo();
  var comoCliente = db.tareas.filter(function (t) { return t.autorId === u.id; });
  var comoTrabajador = db.tareas.filter(function (t) { return t.trabajadorId === u.id; });
  var guardadas = db.tareas.filter(function (t) { return u.guardados.indexOf(t.id) >= 0 && t.estado === "PUBLICADA"; });

  function bloque(titulo, lista, rotulo) {
    if (!lista.length) return "";
    var h = '<div class="tit" style="margin-top:8px"><span class="rotulo ' + rotulo + '">' + titulo + "</span></div>";
    lista.forEach(function (t) {
      var otro = t.trabajadorId ? usuario(t.autorId === u.id ? t.trabajadorId : t.autorId) : null;
      h += '<div class="tarjeta" data-accion="ir" data-pantalla="tarea" data-id="' + t.id + '" style="cursor:pointer">' +
        '<div style="display:flex; justify-content:space-between; gap:10px">' +
        '<div><h3 style="font-size:15.5px">' + esc(t.titulo) + "</h3>" +
        '<div class="guia">' + ETIQUETA_ESTADO[t.estado] + (otro ? " · " + esc(otro.nombre) : "") + "</div></div>" +
        '<div class="mono" style="font-weight:500">' + plata(t.presupuesto) + "</div></div>" +
        '<div style="margin-top:8px"><span class="folio">' + t.folio + "</span></div></div>";
    });
    return h;
  }

  var h = '<div class="tit"><span class="rotulo">Mis tareas</span><h2>Todo lo mío</h2></div>';
  if (!comoCliente.length && !comoTrabajador.length && !guardadas.length) {
    h += '<div class="vacio">Todavía no publicaste ni tomaste nada.<br>Mirá el inicio o publicá tu primera tarea.</div>';
  }
  h += bloque("Estoy trabajando", comoTrabajador, "verde");
  h += bloque("Publiqué", comoCliente, "azul");
  h += bloque("Guardadas", guardadas, "ambar");
  return h;
}

/* ---------- Detalle de una tarea ---------- */
function vistaTarea() {
  var t = tarea(vista.params.id), u = yo();
  if (!t) return '<div class="vacio">Esa tarea ya no está.</div>';
  var r = rubroPorSlug[t.rubro];
  var soyCliente = t.autorId === u.id;
  var soyTrabajador = t.trabajadorId === u.id;
  var otro = t.trabajadorId ? usuario(soyCliente ? t.trabajadorId : t.autorId) : (soyCliente ? null : usuario(t.autorId));
  var asignada = ["ASIGNADA", "EN_CAMINO", "EN_PROGRESO", "ENTREGADA"].indexOf(t.estado) >= 0;

  var h = '<button class="btn chico" style="width:auto" data-accion="atras">‹ Volver</button>';
  h += '<div class="tit" style="margin-top:4px"><span class="folio">' + t.folio + '</span><span class="chip">' + ETIQUETA_ESTADO[t.estado] + "</span>" +
    '<span class="chip">' + nombreCat(r.cat) + "</span></div>";
  h += "<h2>" + esc(t.titulo) + "</h2>";
  h += '<p class="guia">' + esc(t.descripcion) + "</p>";
  if (t.fotos && t.fotos.length) {
    h += '<div class="fotos' + (t.fotos.length === 1 ? " una" : "") + '">' +
      t.fotos.map(function (f) { return '<img src="' + f + '" alt="Foto del trabajo">'; }).join("") + "</div>";
  }

  h += '<div class="tarjeta plana">' +
    '<div class="fila"><span class="k">Oficio</span><span class="v">' + esc(r.nombre) + "</span></div>" +
    '<div class="fila"><span class="k">Cuánto</span><span class="v">' + t.unidades + " " + unidadTexto(r.unidad, t.unidades) + "</span></div>" +
    '<div class="fila"><span class="k">Dificultad</span><span class="v">' + t.dificultad + "</span></div>" +
    '<div class="fila"><span class="k">Cuándo</span><span class="v">' + esc(cuandoTexto(t)) +
      (t.franja ? " · " + FRANJAS[t.franja].split(" · ")[1] : "") + "</span></div>" +
    '<div class="fila"><span class="k">Zona</span><span class="v">' + zonaPorId[t.zona].nombre + "</span></div>" +
    '<div class="fila"><span class="k">Dirección exacta</span><span class="v">' + (asignada || t.estado === "PAGADA" ? "Av. Manuel Montt 1240, depto 5B" : "se ve al asignarse") + "</span></div>" +
    '<div class="fila fuerte"><span class="k">Presupuesto cerrado</span><span class="v">' + plata(t.presupuesto) + "</span></div>" +
    '<div class="fila"><span class="k">Mínimo del oficio ese día</span><span class="v">' + plata(t.minimo) + "</span></div></div>";

  if (otro) h += fichaPersona(otro, soyCliente);

  var acciones = "";
  if (t.estado === "PUBLICADA" && !soyCliente) {
    var e = elegibilidad(t, u);
    acciones += e.ok
      ? '<button class="btn primario" data-accion="aceptar" data-id="' + t.id + '">Aceptar este trabajo</button>'
      : '<div class="tarjeta alerta"><strong>' + esc(e.motivo) + "</strong>" + (e.detalle ? '<div class="guia">' + esc(e.detalle) + "</div>" : "") + "</div>";
  }
  if (soyTrabajador && t.estado === "ASIGNADA") {
    acciones += '<button class="btn primario" data-accion="estado" data-id="' + t.id + '" data-hacia="EN_CAMINO">Voy en camino</button>' +
      '<button class="btn chico" data-accion="estado" data-id="' + t.id + '" data-hacia="PUBLICADA">No puedo hacerlo, devolverla</button>';
  }
  if (soyTrabajador && t.estado === "EN_CAMINO") {
    acciones += '<div class="tarjeta plana"><label class="rotulo" for="f-codigo">Código que te dicta el cliente</label>' +
      '<input id="f-codigo" inputmode="numeric" maxlength="4" placeholder="4 dígitos" style="margin-top:6px; text-align:center; letter-spacing:.3em; font-family:\'IBM Plex Mono\',monospace">' +
      '<button class="btn primario" style="margin-top:10px" data-accion="empezar" data-id="' + t.id + '">Empezar el trabajo</button></div>';
  }
  if (soyCliente && (t.estado === "EN_CAMINO" || t.estado === "ASIGNADA")) {
    acciones += '<div class="tarjeta oscura"><div class="rotulo">Código de inicio</div>' +
      '<div class="codigo">' + t.codigoInicio + "</div>" +
      '<p class="guia" style="text-align:center">Decíselo cuando llegue. Sin ese número no puede empezar.</p></div>';
  }
  if (soyTrabajador && t.estado === "EN_PROGRESO") {
    acciones += '<div class="tarjeta plana"><div class="rotulo">Foto de cómo quedó</div>' +
      '<p class="guia" style="margin:6px 0 10px">Es la prueba de lo que entregaste. Si después hay un reclamo, esto es lo que mira soporte.</p>' +
      bloqueFotos(t.fotosEntrega || [], "entrega:" + t.id) + "</div>" +
      '<button class="btn primario" data-accion="estado" data-id="' + t.id + '" data-hacia="ENTREGADA">Terminé el trabajo</button>' +
      '<button class="btn peligro chico" data-accion="abrir-disputa" data-id="' + t.id + '">Hubo un problema</button>';
  }
  if (soyCliente && t.estado === "ENTREGADA") {
    var lc = liquidar(t, usuario(t.trabajadorId).nivel);
    acciones += '<div class="tarjeta destacada"><h3>' + esc(otro.nombre) + " terminó</h3>" +
      '<div class="fila" style="margin-top:8px"><span class="k">Tarea</span><span class="v">' + plata(t.presupuesto) + "</span></div>" +
      (t.metodoPago === "TARJETA"
        ? '<div class="fila"><span class="k">Cargo de servicio</span><span class="v">' + plata(lc.servicio) + "</span></div>" +
          '<div class="fila fuerte"><span class="k">Total</span><span class="v">' + plata(lc.cobroCliente) + "</span></div>"
        : '<div class="fila"><span class="k">Le pagás en la mano</span><span class="v">' + plata(t.presupuesto) + "</span></div>") +
      bloquePropina(t) +
      '<button class="btn primario" style="margin-top:12px" data-accion="confirmar" data-id="' + t.id + '">' +
      (t.metodoPago === "TARJETA" ? "Confirmar y pagar" : "Confirmar que ya le pagué") + "</button></div>";
    if (t.fotosEntrega && t.fotosEntrega.length) {
      acciones += '<div class="tarjeta plana"><div class="rotulo">Cómo quedó</div><div class="fotos' +
        (t.fotosEntrega.length === 1 ? " una" : "") + '">' +
        t.fotosEntrega.map(function (f) { return '<img src="' + f + '" alt="Foto de la entrega">'; }).join("") + "</div></div>";
    }
    acciones += '<button class="btn peligro chico" data-accion="abrir-disputa" data-id="' + t.id + '">Algo salió mal</button>';
  }
  if (soyCliente && ["PUBLICADA", "ASIGNADA", "EN_CAMINO"].indexOf(t.estado) >= 0) {
    acciones += '<button class="btn peligro chico" data-accion="estado" data-id="' + t.id + '" data-hacia="CANCELADA">Cancelar la tarea</button>' +
      (t.estado === "EN_CAMINO"
        ? '<p class="guia" style="text-align:center">Ya salió para tu casa: cancelar ahora tiene un cargo de ' +
          plata(cargoPorCancelacion(t, "EN_CAMINO").cargo) + ", que va casi entero para el trabajador.</p>"
        : "");
  }
  if (acciones) h += '<div class="botonera">' + acciones + "</div>";

  if (t.estado === "PAGADA") {
    var p = t.pago;
    h += '<div class="tarjeta"><div class="rotulo">Cómo se repartió</div>' +
      '<div class="reparto" style="margin-top:8px">' +
      '<i class="r-neto" style="flex:' + p.neto + '"></i>' +
      '<i class="r-com" style="flex:' + p.comision + '"></i>' +
      '<i class="r-serv" style="flex:' + p.servicio + '"></i></div>' +
      '<div class="leyenda"><span><i style="background:var(--verde)"></i>Trabajador</span>' +
      '<span><i class="r-com"></i>Comisión</span>' +
      '<span><i class="r-serv"></i>Servicio</span></div>' +
      '<div style="margin-top:10px">' +
      (t.metodoPago === "TARJETA"
        ? '<div class="fila"><span class="k">Pagó el cliente</span><span class="v">' + plata(p.total) + "</span></div>"
        : '<div class="fila"><span class="k">Cobró en la mano</span><span class="v">' + plata(t.presupuesto) + "</span></div>") +
      '<div class="fila"><span class="k">Comisión (' + Math.round(p.tasa * 100) + '%)</span><span class="v">' + plata(p.comision) + "</span></div>" +
      '<div class="fila"><span class="k">Cargo de servicio</span><span class="v">' + plata(p.servicio) + "</span></div>" +
      (t.propina ? '<div class="fila"><span class="k">Propina (va entera)</span><span class="v">' + plata(t.propina) + "</span></div>" : "") +
      '<div class="fila fuerte"><span class="k">Le quedó al trabajador</span><span class="v">' + plata(p.neto) + "</span></div></div></div>";
  }

  if (t.estado === "EN_DISPUTA") {
    h += '<div class="tarjeta alerta"><h3>Reclamo abierto</h3>' +
      '<p class="guia" style="margin-top:6px">' + esc(t.disputa ? t.disputa.motivo : "") + "</p>" +
      '<p class="guia" style="margin-top:8px">La tarea queda congelada y el pago retenido hasta que soporte resuelva. ' +
      "En esta demostración podés hacer de soporte vos mismo:</p>" +
      '<div class="botonera" style="margin-top:12px">' +
      '<button class="btn chico" data-accion="resolver" data-id="' + t.id + '" data-favor="trabajador">Resolver a favor del trabajador (se paga)</button>' +
      '<button class="btn chico" data-accion="resolver" data-id="' + t.id + '" data-favor="cliente">Resolver a favor del cliente (se libera)</button>' +
      "</div></div>";
  }
  if (t.cargoCancelacion) {
    h += '<div class="tarjeta alerta"><div class="rotulo">Cancelación tardía</div>' +
      '<div class="fila" style="margin-top:8px"><span class="k">Cargo al cliente</span><span class="v">' + plata(t.cargoCancelacion) + "</span></div>" +
      '<div class="fila"><span class="k">Compensación al trabajador</span><span class="v">' + plata(Math.floor(t.cargoCancelacion * .8)) + "</span></div></div>";
  }

  if ((t.estado === "PAGADA" || t.estado === "ENTREGADA") && t.trabajadorId && (soyCliente || soyTrabajador)) {
    h += bloqueCalificacion(t, u, otro, soyCliente);
  }
  if (t.estado === "PUBLICADA") h += bloquePreguntas(t, u, soyCliente);
  if (asignada && (soyCliente || soyTrabajador)) h += bloqueChat(t, u, otro);

  var eventos = db.eventos.filter(function (e2) { return e2.tareaId === t.id; });
  h += '<div class="tarjeta plana"><div class="rotulo">Bitácora</div><div class="linea-tiempo" style="margin-top:10px">' +
    eventos.map(function (e2) {
      return '<div class="hito"><span class="p"></span><div><strong>' + ETIQUETA_ESTADO[e2.hacia] + "</strong>" +
        (e2.nota ? " — " + esc(e2.nota) : "") + '<div class="c">' + reloj(e2.cuando) + " · " + hace(e2.cuando) + "</div></div></div>";
    }).join("") + "</div></div>";
  return h;
}

/** Propina: se ofrece al confirmar, y va entera a quien hizo el trabajo. */
function bloquePropina(t) {
  var opciones = [0, Math.floor(t.presupuesto * .1), Math.floor(t.presupuesto * .15), Math.floor(t.presupuesto * .2)];
  return '<div style="margin-top:14px"><div class="rotulo">¿Le dejás propina?</div>' +
    '<div class="propinas">' + opciones.map(function (m, i) {
      return '<button type="button" data-accion="propina" data-monto="' + m + '" aria-pressed="' + (vista.propina === m) + '">' +
        (i === 0 ? "No" : plata(m)) + "</button>";
    }).join("") + "</div>" +
    '<p class="guia">La propina no paga comisión.</p></div>';
}

function fichaPersona(p, esTrabajador) {
  var h = '<div class="tarjeta">' +
    '<div style="display:flex; gap:11px; align-items:center">' +
    '<span class="avatar g">' + iniciales(p.nombre) + "</span>" +
    '<div><strong data-accion="ver-perfil" data-id="' + p.id + '" style="cursor:pointer; text-decoration:underline; text-underline-offset:3px">' + esc(p.nombre) + "</strong>" +
    '<div class="guia">' + (p.esTrabajador ? estrellasDe(p) + " ★ · " + p.stats.completados + " trabajos" : "Cliente") + "</div></div></div>";
  if (p.bio) h += '<p class="guia" style="margin-top:10px">' + esc(p.bio) + "</p>";
  h += '<div class="chips" style="margin-top:10px">' +
    (p.esTrabajador ? chipNivel(p.nivel) : "") +
    (p.doc.estado === "VERIFICADO" ? '<span class="chip on">Documento verificado</span>' : "") +
    (p.linkedin ? '<span class="chip">LinkedIn</span>' : "") +
    (p.formacion ? '<span class="chip">' + esc(p.formacion.split("·")[0].trim()) + "</span>" : "") +
    "</div></div>";
  return h;
}

function bloqueCalificacion(t, u, otro, soyCliente) {
  var mia = db.calificaciones.filter(function (c) { return c.tareaId === t.id && c.autorId === u.id; })[0];
  var suya = db.calificaciones.filter(function (c) { return c.tareaId === t.id && c.autorId === otro.id; })[0];
  var h = '<div class="tarjeta plana">';
  if (!mia) {
    h += '<div class="rotulo">¿Cómo estuvo ' + esc(otro.nombre.split(" ")[0]) + "?</div>" +
      '<div class="estrellas" id="f-estrellas" style="margin:8px 0">' +
      [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-estrella="' + n + '">★</button>'; }).join("") + "</div>" +
      '<input id="f-comentario" placeholder="Comentario (opcional)">' +
      (soyCliente ? '<label style="display:flex; gap:8px; align-items:center; margin-top:10px; font-size:13.5px"><input type="checkbox" id="f-puntual" checked> Llegó a horario</label>' : "") +
      '<button class="btn primario" style="margin-top:10px" data-accion="calificar" data-id="' + t.id + '">Enviar calificación</button>';
  } else {
    h += '<div class="rotulo">Tu calificación</div><div class="estrellas" style="margin-top:6px">' +
      [1, 2, 3, 4, 5].map(function (n) { return '<span style="color:' + (n <= mia.estrellas ? "var(--verde)" : "var(--linea-fuerte)") + '; font-size:24px">★</span>'; }).join("") + "</div>";
    h += suya && suya.visible
      ? '<div style="margin-top:10px"><div class="rotulo">Lo que puso ' + esc(otro.nombre.split(" ")[0]) + "</div>" +
        '<div class="estrellas" style="margin-top:6px">' + [1, 2, 3, 4, 5].map(function (n) {
          return '<span style="color:' + (n <= suya.estrellas ? "var(--verde)" : "var(--linea-fuerte)") + '; font-size:24px">★</span>'; }).join("") + "</div>" +
        (suya.comentario ? '<p class="guia">' + esc(suya.comentario) + "</p>" : "") + "</div>"
      : '<p class="guia" style="margin-top:8px">La calificación de la otra parte se muestra cuando también califique.</p>';
  }
  return h + "</div>";
}

function bloquePreguntas(t, u, soyCliente) {
  var preguntas = db.preguntas.filter(function (p) { return p.tareaId === t.id; });
  var h = '<div class="tarjeta plana"><div class="rotulo">Preguntas</div>';
  if (!preguntas.length) h += '<p class="guia" style="margin-top:6px">Todavía nadie preguntó nada.</p>';
  preguntas.forEach(function (p) {
    h += '<div style="margin-top:10px"><strong style="font-size:13.5px">' + esc(usuario(p.autorId).nombre.split(" ")[0]) + ': </strong>' +
      '<span style="font-size:13.5px">' + esc(p.texto) + "</span>";
    if (p.respuesta) h += '<div class="guia" style="margin-top:4px">↳ ' + esc(p.respuesta) + "</div>";
    else if (soyCliente) h += '<div style="display:flex; gap:6px; margin-top:6px"><input data-respuesta-de="' + p.id + '" placeholder="Responder"><button class="btn chico" style="width:auto" data-accion="responder" data-id="' + p.id + '">Enviar</button></div>';
    h += "</div>";
  });
  if (!soyCliente) {
    h += '<div style="display:flex; gap:6px; margin-top:12px"><input id="f-pregunta" placeholder="Preguntar algo puntual"><button class="btn chico" style="width:auto" data-accion="preguntar" data-id="' + t.id + '">Enviar</button></div>' +
      '<p class="guia" style="margin-top:6px">Hasta 2 preguntas por tarea: esto no es un hilo de comentarios.</p>';
  }
  return h + "</div>";
}

function bloqueChat(t, u, otro) {
  var msjs = db.mensajes.filter(function (m) { return m.tareaId === t.id; });
  var h = '<div class="tarjeta plana"><div class="rotulo">Chat con ' + esc(otro.nombre.split(" ")[0]) + "</div>";
  h += '<div class="hilo" style="margin-top:10px">' + (msjs.length ? msjs.map(function (m) {
    var mio = m.autorId === u.id;
    return '<div class="globo-msj ' + (mio ? "mio" : "") + '"><span class="quien">' + esc(usuario(m.autorId).nombre.split(" ")[0]) + " · " + reloj(m.cuando) + "</span>" + esc(m.texto) + "</div>";
  }).join("") : '<p class="guia">Nadie escribió todavía.</p>') + "</div>";
  return h + '<div style="display:flex; gap:6px; margin-top:10px"><input id="f-mensaje" placeholder="Escribir..."><button class="btn chico" style="width:auto" data-accion="mensaje" data-id="' + t.id + '">Enviar</button></div></div>';
}

/* ---------- Saldo ---------- */
function vistaSaldo() {
  var u = yo();
  var movs = db.movimientos.filter(function (m) { return m.usuarioId === u.id; });
  var deuda = u.saldo < 0 ? -u.saldo : 0;
  var h = '<div class="tit"><span class="rotulo">Saldo</span><h2>Tu plata</h2></div>';
  h += '<div class="tarjeta ' + (deuda ? "alerta" : "destacada") + '">' +
    '<div class="rotulo">' + (deuda ? "Debés de comisiones" : "Disponible") + "</div>" +
    '<div class="monto-gigante" style="margin-top:4px; color:' + (deuda ? "var(--ocre-tinta)" : "var(--verde-tinta)") + '">' + plata(Math.abs(u.saldo)) + "</div>";
  if (deuda) {
    h += '<p class="guia" style="margin-top:8px">Cobraste en efectivo, así que la comisión te queda como deuda. Si llega a ' + plata(LIMITE_DEUDA) + " no vas a poder tomar más trabajos.</p>" +
      '<button class="btn peligro" style="margin-top:10px" data-accion="pagar-deuda">Pagar ahora</button>';
  } else if (u.saldo > 0) {
    h += '<button class="btn primario" style="margin-top:12px" data-accion="retirar">Retirar a mi cuenta</button>';
  } else {
    h += '<p class="guia" style="margin-top:8px">Todavía no tenés movimientos.</p>';
  }
  h += "</div>";
  if (movs.length) {
    h += '<div class="tarjeta plana"><div class="rotulo">Movimientos</div>';
    movs.forEach(function (m) {
      h += '<div class="fila" style="margin-top:10px"><span class="k">' + esc(m.detalle) +
        '<br><span class="mono" style="font-size:11px">' + hace(m.cuando) + "</span></span>" +
        '<span class="v" style="color:' + (m.monto >= 0 ? "var(--verde-tinta)" : "var(--ocre-tinta)") + '">' +
        (m.monto >= 0 ? "+" : "−") + plata(Math.abs(m.monto)) + "</span></div>";
    });
    h += "</div>";
  }

}

/* ==========================================================================
   5. ARMADO DE LA PANTALLA
   ========================================================================== */

var PESTANAS = [
  { id: "inicio", ic: "⌂", txt: "Inicio" },
  { id: "publicar", ic: "＋", txt: "Publicar" },
  { id: "tareas", ic: "▤", txt: "Mis tareas" },
  { id: "saldo", ic: "◈", txt: "Saldo" },
  { id: "perfil", ic: "◍", txt: "Perfil" }
];
var PUBLICAS = ["portada", "ingresar", "crear", "linkedin"];

function render() {
  var app = document.getElementById("app");

  // Con la sesión abierta no tiene sentido volver a la portada: se entra derecho.
  // (linkedin queda afuera: desde adentro sirve para conectar la cuenta.)
  if (db.sesionId && ["portada", "ingresar", "crear"].indexOf(vista.pantalla) >= 0) vista.pantalla = "inicio";

  // Sin sesión no hay app: primero la portada.
  if (!db.sesionId || PUBLICAS.indexOf(vista.pantalla) >= 0) {
    if (!db.sesionId && PUBLICAS.indexOf(vista.pantalla) === -1) vista.pantalla = "portada";
    if (vista.pantalla === "portada") { app.innerHTML = vistaPortada(); return; }
    var cuerpoPublico = vista.pantalla === "ingresar" ? vistaIngresar()
      : vista.pantalla === "crear" ? vistaCrear() : vistaLinkedin();
    app.innerHTML =
      "<main>" + cuerpoPublico + "</main>";
    return;
  }

  var u = yo();
  var cuerpo = "", pegado = false;
  if (vista.pantalla === "inicio") { cuerpo = vistaFeed(); pegado = true; }
  else if (vista.pantalla === "publicar") cuerpo = vistaPublicar();
  else if (vista.pantalla === "tareas") cuerpo = vistaTareas();
  else if (vista.pantalla === "tarea") cuerpo = vistaTarea();
  else if (vista.pantalla === "saldo") cuerpo = vistaSaldo();
  else if (vista.pantalla === "perfil") cuerpo = vistaPerfil();
  else if (vista.pantalla === "editar") cuerpo = vistaEditar();
  else if (vista.pantalla === "avisos") { cuerpo = vistaAvisos(); pegado = true; }
  else if (vista.pantalla === "perfil-publico") cuerpo = vistaPerfilPublico();

  var pendientes = db.tareas.filter(function (t) {
    return (t.autorId === u.id && t.estado === "ENTREGADA") ||
      (t.trabajadorId === u.id && ["ASIGNADA", "EN_CAMINO", "EN_PROGRESO"].indexOf(t.estado) >= 0);
  }).length;

  var desfaseMin = Math.round(db.desfase / 60000);
  app.innerHTML =
    '<div class="barra">' +
      '<span class="marca">Tareas</span>' +
      '<button class="reloj-chip" data-accion="adelantar" title="Adelantar el reloj para ver cómo se abren las olas">▶▶ +2 min' +
      (desfaseMin ? " (" + desfaseMin + ")" : "") + "</button>" +
      '<span class="sep"></span>' +
      '<button class="campana" data-accion="ver-avisos" aria-label="Avisos">✷' +
      (sinLeer(u.id) ? '<span class="pun">' + sinLeer(u.id) + "</span>" : "") + "</button>" +
      '<button class="usuario-chip" data-accion="ir" data-pantalla="perfil">' +
        '<span class="avatar">' + iniciales(u.nombre) + "</span>" +
        "<small>" + esc(u.nombre.split(" ")[0]) + "</small></button>" +
    "</div>" +
    '<main class="' + (pegado ? "pegado" : "") + '">' + cuerpo + "</main>" +
    '<nav class="pestanas">' + PESTANAS.map(function (p) {
      var activa = vista.pantalla === p.id ||
        (p.id === "tareas" && vista.pantalla === "tarea") ||
        (p.id === "perfil" && ["editar", "perfil-publico"].indexOf(vista.pantalla) >= 0);
      return '<button data-accion="ir" data-pantalla="' + p.id + '"' + (activa ? ' aria-current="page"' : "") + ">" +
        '<span class="ic">' + p.ic + "</span>" + p.txt +
        (p.id === "tareas" && pendientes ? '<span class="globo-n">' + pendientes + "</span>" : "") + "</button>";
    }).join("") + "</nav>";

  enganchar();
}

/** Campos que actualizan el precio sin volver a dibujar toda la pantalla. */
function enganchar() {
  var b = vista.borrador;
  if (vista.pantalla === "publicar" && b) {
    var refrescar = function () {
      var r = rubroPorSlug[b.rubro];
      var q = cotizar(b);
      if (b.presupuesto < q.minimo) b.presupuesto = q.sugerido;
      var val = document.getElementById("f-unidades-val");
      if (val) val.textContent = b.unidades + " " + unidadTexto(r.unidad, b.unidades);
      document.getElementById("caja-precio").innerHTML = cajaPrecio(b);
      engancharPrecio();
    };
    var atar = function (idCampo, campo, numero) {
      var el = document.getElementById(idCampo);
      if (!el) return;
      el.addEventListener("input", function () {
        b[campo] = numero ? Number(el.value) : el.value;
        if (campo === "rubro") { b.unidades = rubroPorSlug[b.rubro].min; b.presupuesto = null; render(); return; }
        if (campo === "titulo" || campo === "descripcion") return;
        refrescar();
      });
    };
    atar("f-rubro", "rubro"); atar("f-titulo", "titulo"); atar("f-desc", "descripcion");
    atar("f-unidades", "unidades", true); atar("f-dif", "dificultad"); atar("f-urg", "urgencia");
    atar("f-niv", "nivelMinimo"); atar("f-zona", "zona"); atar("f-pago", "metodoPago");
    var fecha = document.getElementById("f-fecha");
    if (fecha) fecha.addEventListener("change", function () { b.programadaPara = fecha.value; });
    engancharPrecio();
  }
  if (vista.pantalla === "inicio") {
    var buscar = document.getElementById("f-buscar");
    if (buscar) {
      buscar.addEventListener("input", function () {
        vista.busqueda = buscar.value;
        var pos = buscar.selectionStart;
        render();
        var nuevo = document.getElementById("f-buscar");
        if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(pos, pos); }
      });
    }
    var dis = document.getElementById("f-distancia");
    if (dis) dis.addEventListener("change", function () { vista.distancia = Number(dis.value); render(); });
    var mon = document.getElementById("f-monto");
    if (mon) mon.addEventListener("change", function () { vista.montoMin = Number(mon.value); render(); });
  }
  // Las fotos se comprimen acá adentro: al disco va una imagen chica, no la original.
  Array.prototype.forEach.call(document.querySelectorAll("[data-fotos-para]"), function (input) {
    input.addEventListener("change", function () {
      var archivo = input.files && input.files[0];
      if (!archivo) return;
      comprimirFoto(archivo, function (datos) { guardarFoto(input.dataset.fotosPara, datos); });
    });
  });
  if (vista.pantalla === "tarea") {
    var estrellas = document.getElementById("f-estrellas");
    if (estrellas) {
      estrellas.addEventListener("click", function (ev) {
        var bo = ev.target.closest("button[data-estrella]");
        if (!bo) return;
        vista.estrellas = Number(bo.dataset.estrella);
        Array.prototype.forEach.call(estrellas.children, function (x, i) { x.classList.toggle("on", i < vista.estrellas); });
      });
    }
  }
}

function engancharPrecio() {
  var el = document.getElementById("f-precio");
  if (!el) return;
  el.addEventListener("input", function () {
    vista.borrador.presupuesto = Number(el.value);
    document.getElementById("caja-precio").innerHTML = cajaPrecio(vista.borrador);
    engancharPrecio();
  });
}

/* ==========================================================================
   6. ACCIONES
   ========================================================================== */

function entrarComo(uid, saludo) {
  db.sesionId = uid;
  marcar(); guardar();
  vista.borrador = null;
  vista.cat = "PARA_VOS";
  ir("inicio");
  if (saludo !== false) aviso("Entraste como " + yo().nombre, "bien");
}

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-accion]");
  if (!el) return;
  var a = el.dataset.accion;

  /* --- navegación --- */
  if (a === "ir") {
    if (["ingresar", "crear", "linkedin"].indexOf(el.dataset.pantalla) >= 0) vista.borrador = null;
    ir(el.dataset.pantalla, { id: el.dataset.id });
    return;
  }
  if (a === "atras") { ir(db.tareas.some(function (t) { return t.id === vista.params.id && (t.autorId === db.sesionId || t.trabajadorId === db.sesionId); }) ? "tareas" : "inicio"); return; }
  if (a === "cat") { vista.cat = el.dataset.cat; render(); return; }

  /* --- avisos y perfiles --- */
  if (a === "ver-avisos") {
    avisosDe(db.sesionId).forEach(function (n) { n.leido = true; });
    marcar(); guardar();
    ir("avisos");
    return;
  }
  if (a === "ver-perfil") { ir("perfil-publico", { id: el.dataset.id }); return; }
  if (a === "limpiar-busqueda") { vista.busqueda = ""; render(); return; }

  /* --- publicar: cuándo y fotos --- */
  if (a === "franja") {
    vista.borrador.franja = vista.borrador.franja === el.dataset.franja ? "" : el.dataset.franja;
    render();
    return;
  }
  if (a === "quitar-foto") {
    var destino = el.dataset.destino, indice = Number(el.dataset.i);
    if (destino === "borrador") {
      vista.borrador.fotos.splice(indice, 1);
    } else {
      var tf = tarea(destino.split(":")[1]);
      tf.fotosEntrega.splice(indice, 1);
      marcar(); guardar();
    }
    render();
    return;
  }

  /* --- plata --- */
  if (a === "propina") { vista.propina = Number(el.dataset.monto); render(); return; }
  if (a === "confirmar") {
    cambiarEstado(el.dataset.id, "CONFIRMADA", { propina: vista.propina });
    vista.propina = 0;
    return;
  }
  if (a === "abrir-disputa") {
    var motivo = prompt("Contá qué pasó. Soporte lo va a leer:");
    if (!motivo || !motivo.trim()) return;
    abrirDisputa(el.dataset.id, motivo.trim());
    return;
  }
  if (a === "resolver") { resolverDisputa(el.dataset.id, el.dataset.favor === "trabajador"); return; }

  /* --- entrar y salir --- */
  if (a === "entrar") { entrarComo(el.dataset.id); return; }
  if (a === "cerrar-sesion") {
    db.sesionId = null;
    marcar(); guardar();
    vista.borrador = null;
    ir("portada");
    return;
  }
  if (a === "google") {
    aviso("Google todavía no está conectado en esta demostración: entrá con LinkedIn o con tu teléfono.");
    return;
  }
  if (a === "ingresar-codigo") {
    var b1 = vista.borrador;
    b1.telefono = document.getElementById("i-tel").value.trim();
    var existe = db.usuarios.filter(function (x) { return x.telefono === b1.telefono; })[0];
    if (!existe) return aviso("No hay ninguna cuenta con ese teléfono", "mal");
    b1.esperado = String(Math.floor(100000 + Math.random() * 900000));
    b1.paso = 2;
    render();
    return;
  }
  if (a === "ingresar-verificar") {
    var b2 = vista.borrador;
    if (document.getElementById("i-codigo").value.trim() !== b2.esperado) return aviso("El código no es correcto", "mal");
    var quien = db.usuarios.filter(function (x) { return x.telefono === b2.telefono; })[0];
    entrarComo(quien.id);
    return;
  }

  /* --- crear cuenta --- */
  if (a === "crear-codigo") {
    var b3 = vista.borrador;
    b3.nombre = document.getElementById("c-nombre").value.trim();
    b3.telefono = document.getElementById("c-tel").value.trim();
    b3.zona = document.getElementById("c-zona").value;
    if (b3.nombre.length < 3) return aviso("Escribí tu nombre y apellido", "mal");
    if (b3.telefono.replace(/\D/g, "").length < 8) return aviso("Ese teléfono no parece válido", "mal");
    if (db.usuarios.some(function (x) { return x.telefono === b3.telefono; })) return aviso("Ya hay una cuenta con ese teléfono", "mal");
    b3.esperado = String(Math.floor(100000 + Math.random() * 900000));
    b3.paso = 2;
    render();
    return;
  }
  if (a === "crear-verificar") {
    var b4 = vista.borrador;
    if (document.getElementById("c-codigo").value.trim() !== b4.esperado) return aviso("El código no es correcto", "mal");
    b4.paso = 3;
    render();
    return;
  }
  if (a === "crear-listo") {
    var b5 = vista.borrador;
    var campoFormacion = document.getElementById("c-formacion");
    if (campoFormacion) b5.formacion = campoFormacion.value.trim();
    var nuevo = nuevoUsuario({
      nombre: b5.nombre, telefono: b5.telefono, zona: b5.zona,
      esTrabajador: b5.quiere !== "NECESITO",
      formacion: b5.formacion, linkedin: b5.linkedin,
      rubros: b5.quiere === "NECESITO" ? [] : []
    });
    db.usuarios.push(nuevo);
    entrarComo(nuevo.id, false);
    aviso("Cuenta creada. Verificá tu documento para poder trabajar.", "bien");
    ir("editar");
    return;
  }

  /* --- LinkedIn --- */
  if (a === "linkedin-aceptar") {
    var bl = vista.borrador;
    bl.nombre = document.getElementById("l-nombre").value.trim();
    bl.titular = document.getElementById("l-titular").value.trim();
    bl.formacion = document.getElementById("l-formacion").value.trim();
    if (bl.nombre.length < 3) return aviso("Falta el nombre", "mal");

    var perfilLin = { url: "linkedin.com/in/" + bl.nombre.toLowerCase().replace(/\s+/g, "-"), titular: bl.titular, empresa: bl.empresa || "", verificado: true };
    if (db.sesionId) {
      // Ya estaba adentro: sólo conecta la cuenta.
      var yoMismo = yo();
      yoMismo.linkedin = perfilLin;
      if (!yoMismo.formacion) yoMismo.formacion = bl.formacion;
      marcar(); guardar();
      ir("perfil");
      aviso("LinkedIn conectado: ya podés tomar trabajos especializados", "bien");
      return;
    }
    vista.borrador = {
      paso: 1, nombre: bl.nombre, telefono: "", zona: "centro", esperado: "",
      quiere: "BUSCO", formacion: bl.formacion, linkedin: perfilLin
    };
    ir("crear");
    aviso("Traído de LinkedIn. Falta verificar tu teléfono.", "bien");
    return;
  }

  /* --- trabajo --- */
  if (a === "aceptar") { aceptarTarea(el.dataset.id); return; }
  if (a === "estado") { cambiarEstado(el.dataset.id, el.dataset.hacia); return; }
  if (a === "empezar") {
    var c = document.getElementById("f-codigo");
    cambiarEstado(el.dataset.id, "EN_PROGRESO", { codigo: c ? c.value : "" });
    return;
  }
  if (a === "publicar") { publicarDesdeFormulario(); return; }
  if (a === "guardar") {
    var uu = yo(), tid = el.dataset.id;
    var i = uu.guardados.indexOf(tid);
    if (i >= 0) uu.guardados.splice(i, 1); else uu.guardados.push(tid);
    marcar(); guardar(); render();
    aviso(i >= 0 ? "Sacada de guardados" : "Guardada para después", "bien");
    return;
  }
  if (a === "calificar") {
    if (!vista.estrellas) return aviso("Elegí cuántas estrellas", "mal");
    var com = document.getElementById("f-comentario");
    var pu = document.getElementById("f-puntual");
    calificar(el.dataset.id, vista.estrellas, com ? com.value : "", pu ? pu.checked : false);
    vista.estrellas = 0;
    return;
  }
  if (a === "preguntar") {
    var q = document.getElementById("f-pregunta");
    if (!q.value.trim()) return aviso("Escribí la pregunta", "mal");
    preguntar(el.dataset.id, q.value.trim());
    return;
  }
  if (a === "responder") {
    var r = document.querySelector('[data-respuesta-de="' + el.dataset.id + '"]');
    if (!r.value.trim()) return;
    responder(el.dataset.id, r.value.trim());
    return;
  }
  if (a === "mensaje") {
    var m = document.getElementById("f-mensaje");
    if (!m.value.trim()) return;
    mensajear(el.dataset.id, m.value.trim());
    return;
  }
  if (a === "pagar-deuda") { pagarDeuda(); return; }
  if (a === "retirar") { retirar(); return; }

  /* --- perfil --- */
  if (a === "guardar-datos") {
    var up = yo();
    var nom = document.getElementById("p-nombre").value.trim();
    if (nom.length < 3) return aviso("El nombre es muy corto", "mal");
    up.nombre = nom;
    up.bio = document.getElementById("p-bio").value.trim();
    up.formacion = document.getElementById("p-formacion").value.trim();
    up.zona = document.getElementById("p-zona").value;
    marcar(); guardar(); render();
    aviso("Perfil actualizado", "bien");
    return;
  }
  if (a === "enviar-doc") {
    var d = document.getElementById("f-doc");
    var num = (d.value || "").replace(/\D/g, "");
    if (num.length < 6) return aviso("Ese número es muy corto", "mal");
    if (db.usuarios.some(function (x) { return x.id !== db.sesionId && x.doc.numero === num; })) {
      return aviso("Ese documento ya está usado en otra cuenta", "mal");
    }
    yo().doc = { numero: num, estado: "EN_REVISION" };
    marcar(); guardar(); render();
    aviso("Documento enviado a verificar", "bien");
    return;
  }
  if (a === "aprobar-doc") {
    var u2 = yo();
    u2.doc.estado = "VERIFICADO";
    u2.nivel = calcularNivel(u2);
    marcar(); guardar(); render();
    aviso("Documento verificado. Ya podés tomar trabajos.", "bien");
    return;
  }
  if (a === "rubro") {
    var u3 = yo(), slug = el.dataset.slug, r2 = rubroPorSlug[slug];
    var i2 = u3.rubros.indexOf(slug);
    if (i2 === -1) u3.rubros.push(slug);
    else if (r2.licencia && u3.licencias.indexOf(slug) === -1) u3.licencias.push(slug);
    else {
      u3.rubros.splice(i2, 1);
      var j = u3.licencias.indexOf(slug);
      if (j >= 0) u3.licencias.splice(j, 1);
    }
    marcar(); guardar(); render();
    return;
  }

  /* --- demostración --- */
  if (a === "adelantar") {
    db.desfase += 2 * 60 * 1000;
    marcar(); guardar(); render();
    aviso("Reloj adelantado 2 minutos: mirá cómo se abren las olas", "bien");
    return;
  }
  if (a === "reiniciar") {
    if (!confirm("Se borra todo lo que hiciste y vuelven los datos de ejemplo. ¿Seguimos?")) return;
    semilla();
    vista.borrador = null;
    ir("portada");
    aviso("Listo, datos de ejemplo otra vez", "bien");
    return;
  }
});

document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.name === "quiere") { vista.borrador.quiere = el.value; render(); return; }
  if (el.id === "f-trabajador") {
    var u = yo();
    u.esTrabajador = el.checked;
    marcar(); guardar(); render();
    return;
  }
  if (el.id === "f-efectivo") { yo().aceptaEfectivo = el.checked; marcar(); guardar(); }
  if (el.id === "f-antecedentes") { yo().antecedentes = el.checked; marcar(); guardar(); }
});

/**
 * Achica la foto antes de guardarla: 900 px de lado y JPEG al 60%.
 * Sin esto, tres fotos de un teléfono moderno no entran en el almacenamiento.
 */
function comprimirFoto(archivo, listo) {
  if (!/^image\//.test(archivo.type)) return aviso("Eso no es una imagen", "mal");
  var lector = new FileReader();
  lector.onload = function () {
    var img = new Image();
    img.onload = function () {
      var lado = 900;
      var escala = Math.min(1, lado / Math.max(img.width, img.height));
      var lienzo = document.createElement("canvas");
      lienzo.width = Math.round(img.width * escala);
      lienzo.height = Math.round(img.height * escala);
      lienzo.getContext("2d").drawImage(img, 0, 0, lienzo.width, lienzo.height);
      listo(lienzo.toDataURL("image/jpeg", .6));
    };
    img.onerror = function () { aviso("No pudimos leer esa imagen", "mal"); };
    img.src = lector.result;
  };
  lector.readAsDataURL(archivo);
}

function guardarFoto(destino, datos) {
  if (destino === "borrador") {
    vista.borrador.fotos = (vista.borrador.fotos || []).concat([datos]).slice(0, 3);
    render();
    return;
  }
  var t = tarea(destino.split(":")[1]);
  if (!t) return;
  t.fotosEntrega = (t.fotosEntrega || []).concat([datos]).slice(0, 3);
  marcar();
  if (!guardar()) {
    t.fotosEntrega.pop();
    return aviso("No entra otra foto: se llenó el almacenamiento del navegador", "mal");
  }
  render();
}

function publicarDesdeFormulario() {
  var b = vista.borrador;
  b.titulo = (document.getElementById("f-titulo").value || "").trim();
  b.descripcion = (document.getElementById("f-desc").value || "").trim();
  if (b.titulo.length < 5) return aviso("Ponele un título que se entienda", "mal");
  if (b.descripcion.length < 10) return aviso("Contá un poco más en el detalle", "mal");
  var q = cotizar(b);
  if (b.presupuesto < q.minimo) return aviso("El presupuesto está por debajo del mínimo del oficio", "mal");

  var fechaCampo = document.getElementById("f-fecha");
  if (fechaCampo) b.programadaPara = fechaCampo.value;
  recargar();
  var t = crearTarea(yo(), b);
  marcar(); guardar();
  vista.borrador = null;
  ir("tarea", { id: t.id });
  aviso("Publicada como " + t.folio + (b.metodoPago === "TARJETA" ? ". Retuvimos los fondos." : ""), "bien");
}

/* Si hay otra ventana abierta, esta se entera y se actualiza sola. */
window.addEventListener("storage", function (e) {
  if (e.key !== CLAVE) return;
  var disco = leerDisco();
  if (disco) { db = disco; render(); }
});

/* El feed depende del tiempo: se refresca solo mientras se mira. */
setInterval(function () {
  if (vista.pantalla !== "inicio" && vista.pantalla !== "tarea") return;
  var foco = document.activeElement;
  if (foco && ["INPUT", "TEXTAREA", "SELECT"].indexOf(foco.tagName) >= 0) return;
  render();
}, 5000);

arrancar();
render();
if (enMemoria) {
  setTimeout(function () { aviso("Este navegador no deja guardar datos: al cerrar se pierde lo que hagas."); }, 800);
}
})();
</script>
