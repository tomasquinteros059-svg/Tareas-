# Construye la APK de Android y la deja para descargar.
#
# Por qué acá y no en la máquina de desarrollo: compilar para Android baja el
# SDK de Google, y no todas las redes lo dejan pasar. Los servidores de GitHub
# ya lo traen puesto. El resultado queda en una publicación («release») con un
# enlace fijo, que es lo que se le puede pasar a alguien para que la instale.
#
# La APK es de depuración, firmada con la clave de prueba de Android: sirve para
# instalarla a mano y probarla, no para subirla a Google Play.
name: APK de Android

on:
  push:
    branches: ['**']
    paths:
      - 'apps/demo-app.html'
      - 'apps/web/**'
      - 'apps/movil/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Armar la app instalable
        run: node apps/web/construir.mjs

      - name: Instalar Capacitor
        working-directory: apps/movil
        run: npm ci

      - name: Crear el proyecto de Android
        working-directory: apps/movil
        run: npx cap add android

      - name: Copiar la app adentro
        working-directory: apps/movil
        run: npx cap sync android

      - name: Compilar la APK
        working-directory: apps/movil/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Ponerle un nombre que se entienda
        id: apk
        run: |
          mkdir -p entrega
          origen=apps/movil/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$origen" || { echo "No se generó la APK"; exit 1; }
          nombre="tareas-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.apk"
          cp "$origen" "entrega/$nombre"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "peso=$(du -h "entrega/$nombre" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: entrega/*.apk
          retention-days: 30

      # La publicación es lo que da un enlace fijo para descargar desde el
      # teléfono. Se reescribe en cada compilación para que "la última" sea
      # siempre la misma dirección.
      #
      # Va por la API y no por la herramienta de línea de comandos: la primera
      # versión de esto se colgaba en ese paso sin decir por qué, y un taller
      # que se cuelga es peor que uno que falla.
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.nombre }}
          PESO: ${{ steps.apk.outputs.peso }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          etiqueta=apk-ultima

          # Borrar lo que haya quedado de la vez anterior. Se listan todas y se
          # filtran por etiqueta en vez de pedirla por nombre, porque una
          # publicación a medio hacer queda como borrador y a esas no se llega
          # por la etiqueta: quedarían acumulándose sin que nadie las vea.
          viejas=$(curl -fsSL "${auth[@]}" "$api/releases?per_page=100" \
            | jq -r --arg tag "$etiqueta" '.[] | select(.tag_name == $tag) | .id')
          for vieja in $viejas; do
            curl -fsS -X DELETE "${auth[@]}" "$api/releases/$vieja"
          done
          curl -sS -o /dev/null -X DELETE "${auth[@]}" "$api/git/refs/tags/$etiqueta" || true

          notas=$(cat <<TEXTO
          APK de prueba construida desde \`$GITHUB_REF_NAME\` (\`${GITHUB_SHA::7}\`), $PESO.

          ## Cómo instalarla

          1. Abrí esta página **desde el teléfono Android** y tocá el archivo \`.apk\` de abajo.
          2. Android va a avisar que la app no viene de la tienda. Hay que darle permiso al navegador para instalar. Es lo normal en una app de prueba.
          3. Queda instalada como **Tareas**.

          ## Qué vas a ver

          Arranca en la **demostración**: la app entera con datos de ejemplo guardados en el teléfono, sin señal y sin servidor. Sirve para probar el diseño, los textos, el tamaño de los botones y el recorrido completo de un trabajo.

          Para usarla contra un servidor de verdad: **Perfil → Conectar con el servidor**, escribir la dirección y guardarla. La app la comprueba antes de aceptarla, así que una dirección mal escrita avisa en el momento.
          TEXTO
          )
          cuerpo=$(jq -n --arg tag "$etiqueta" --arg sha "$GITHUB_SHA" --arg notas "$notas" \
            '{tag_name:$tag, target_commitish:$sha, name:"Tareas · última APK de prueba", body:$notas, draft:false, prerelease:false, make_latest:"true"}')

          subida=$(curl -fsSL -X POST "${auth[@]}" -d "$cuerpo" "$api/releases")
          id=$(printf '%s' "$subida" | jq -r '.id')
          enlace=$(printf '%s' "$subida" | jq -r '.html_url')

          curl -fsS -X POST "${auth[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"entrega/$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$APK" > /dev/null

          echo "APK publicada: $enlace"
          echo "### APK lista · [$APK]($enlace)" >> "$GITHUB_STEP_SUMMARY"
